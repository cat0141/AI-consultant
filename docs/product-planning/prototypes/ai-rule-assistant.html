<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>找客户助手 - AI增长操作系统原型</title>
<style>
:root{--bg:#f5f7fb;--panel:#fff;--line:#e5e7eb;--text:#111827;--muted:#64748b;--blue:#2563eb;--blueSoft:#eef4ff;--green:#16a34a;--greenSoft:#ecfdf3;--orange:#f59e0b;--orangeSoft:#fff7e6;--red:#ef4444;--redSoft:#fff1f2;--purple:#7c3aed;--purpleSoft:#f3edff;--shadow:0 16px 42px rgba(15,23,42,.08);--r:18px}*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#eef4ff,#f8fafc);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Arial,sans-serif;color:var(--text);font-size:14px}.wrap{max-width:1180px;margin:0 auto;padding:28px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.title h1{margin:0 0 6px;font-size:28px}.title p{margin:0;color:#475569;line-height:1.7}.user{background:#fff;border:1px solid var(--line);border-radius:999px;padding:9px 13px;color:#334155;box-shadow:0 6px 18px rgba(15,23,42,.05)}.grid{display:grid;grid-template-columns:420px 1fr;gap:18px;align-items:start}.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}.head{padding:18px;border-bottom:1px solid var(--line)}.head b{font-size:17px}.head small{display:block;color:var(--muted);margin-top:5px}.body{padding:18px}.inputBox{border:1px solid #dbe4f0;border-radius:16px;padding:14px;background:#fbfdff}.inputBox textarea{width:100%;min-height:92px;border:0;outline:none;background:transparent;resize:vertical;font-family:inherit;font-size:15px;line-height:1.7}.quick{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.chip{border:1px solid #dbe4f0;background:#fff;border-radius:999px;padding:8px 11px;cursor:pointer;color:#334155;font-weight:700;font-size:13px}.chip:hover{background:var(--blueSoft);color:var(--blue);border-color:#bcd1ff}.btn{border:1px solid transparent;border-radius:13px;height:40px;padding:0 14px;display:inline-flex;align-items:center;gap:7px;cursor:pointer;font-weight:800;font-family:inherit}.primary{background:var(--blue);color:#fff}.secondary{background:#fff;border-color:var(--line);color:#334155}.soft{background:var(--blueSoft);color:var(--blue)}.green{background:var(--green);color:#fff}.step{display:grid;grid-template-columns:36px 1fr;gap:10px;margin:14px 0;color:#475569;line-height:1.6}.num{width:28px;height:28px;border-radius:50%;background:var(--blueSoft);color:var(--blue);display:grid;place-items:center;font-weight:900}.result{display:none}.result.show{display:block}.section{font-weight:900;margin:18px 0 10px}.plainRule{display:grid;gap:9px}.rule{border:1px solid var(--line);border-radius:14px;padding:12px;background:#fff;display:flex;justify-content:space-between;gap:12px;align-items:center}.ruleText{line-height:1.55}.ruleText b{display:block;margin-bottom:3px}.edit{border:1px solid var(--line);border-radius:10px;padding:7px 9px;background:#f8fafc;color:#334155;cursor:pointer;font-weight:700}.sample{display:grid;gap:10px}.cust{border:1px solid var(--line);border-radius:14px;padding:12px;background:#fff}.custTop{display:flex;justify-content:space-between;gap:10px}.custName{font-weight:900}.tag{display:inline-flex;border-radius:999px;padding:4px 8px;font-size:12px;font-weight:800}.high{background:var(--redSoft);color:#dc2626}.mid{background:var(--orangeSoft);color:#b45309}.ok{background:var(--greenSoft);color:var(--green)}.why{color:#64748b;font-size:13px;line-height:1.6;margin-top:8px}.feedback{display:flex;gap:8px;margin-top:10px}.feedback button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:7px 9px;cursor:pointer}.feedback button.active{background:var(--blueSoft);color:var(--blue);border-color:#a8c5ff;font-weight:800}.tip{background:#f8fafc;border:1px solid var(--line);border-radius:14px;padding:12px;color:#475569;line-height:1.7}.saved{display:none;border:1px solid #bbf7d0;background:#f0fdf4;color:#166534;border-radius:14px;padding:12px;line-height:1.7;margin-top:12px}.saved.show{display:block}.drawer{position:fixed;right:28px;bottom:28px;width:420px;background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);opacity:0;transform:translateY(20px);pointer-events:none;transition:.22s;z-index:20}.drawer.show{opacity:1;transform:translateY(0);pointer-events:auto}.drawerH{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;font-weight:900}.drawerB{padding:16px 18px;line-height:1.7}.drawerB input{width:100%;height:38px;border:1px solid var(--line);border-radius:10px;padding:0 10px;margin-top:6px}.toast{position:fixed;left:50%;top:22px;transform:translateX(-50%) translateY(-20px);opacity:0;background:#0f172a;color:#fff;padding:12px 16px;border-radius:999px;box-shadow:var(--shadow);transition:.2s;z-index:30}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}@media(max-width:960px){.grid{grid-template-columns:1fr}.top{display:block}.user{display:inline-block;margin-top:10px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="title">
      <h1>找客户助手</h1>
      <p>顾问只要说想找什么客户，AI先给出简单条件；顾问改一改，看几家样例，觉得准就保存成自己的规则。</p>
    </div>
    <div class="user">顾问：张三 · 当前客户 286 户</div>
  </div>

  <div class="grid">
    <section class="card">
      <div class="head"><b>你想找哪类客户？</b><small>用日常说法输入，不需要懂字段和规则</small></div>
      <div class="body">
        <div class="inputBox"><textarea id="goal">帮我找适合做高新申报的客户</textarea></div>
        <div class="quick">
          <button class="chip" onclick="setGoal('帮我找适合做高新申报的客户')">高新申报</button>
          <button class="chip" onclick="setGoal('帮我找服务很多但收费偏低，适合涨价沟通的客户')">涨价沟通</button>
          <button class="chip" onclick="setGoal('帮我找最近可能要工商变更的客户')">工商变更</button>
          <button class="chip" onclick="setGoal('帮我找最近有广告投放的客户')">广告投放</button>
        </div>
        <button class="btn primary" onclick="generate()">AI帮我找</button>
        <div class="section">使用方式</div>
        <div class="step"><div class="num">1</div><div>AI先把你的想法转成几条容易看懂的筛选条件。</div></div>
        <div class="step"><div class="num">2</div><div>你可以改条件，比如金额、关键词、行业范围。</div></div>
        <div class="step"><div class="num">3</div><div>先看几家样例，觉得靠谱再保存成自己的规则。</div></div>
      </div>
    </section>

    <section class="card">
      <div class="head"><b>AI生成结果</b><small id="status">还未生成</small></div>
      <div class="body">
        <div class="tip" id="empty">点击左侧“AI帮我找”，这里会显示筛选条件和样例客户。</div>
        <div class="result" id="result">
          <div class="section">筛选条件</div>
          <div class="plainRule" id="rules"></div>
          <div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap">
            <button class="btn soft" onclick="openEdit()">修改条件</button>
            <button class="btn secondary" onclick="runSample()">看几家样例</button>
          </div>

          <div class="section">样例客户</div>
          <div class="sample" id="sample"></div>
          <div style="display:flex;gap:8px;margin-top:14px;flex-wrap:wrap">
            <button class="btn green" onclick="saveRule()">保存成我的规则</button>
            <button class="btn secondary" onclick="toast('已加入今日跟进草稿')">加入今日跟进</button>
          </div>
          <div class="saved" id="saved">已保存为“我的高新申报客户规则”。以后可以直接用它找客户，也可以继续让AI帮你调整。</div>
        </div>
      </div>
    </section>
  </div>
</div>

<div class="drawer" id="drawer">
  <div class="drawerH"><span>修改筛选条件</span><span style="color:#2563eb;cursor:pointer" onclick="drawer(false)">关闭</span></div>
  <div class="drawerB">
    <div>行业范围<input id="industry" value="科技、软件、制造、环保" /></div>
    <div style="margin-top:10px">关键词<input id="words" value="技术开发、软件开发、研发、专利" /></div>
    <div style="margin-top:10px">排除客户<input id="exclude" value="已做过高新服务、注销客户" /></div>
    <button class="btn primary" style="margin-top:14px" onclick="applyEdit()">应用修改</button>
  </div>
</div>
<div class="toast" id="toast"></div>
<script>
let ruleTexts=['行业像科技、软件、制造、环保','经营范围或聊天里出现：技术开发、软件开发、研发、专利','财务或发票里有研发、技术服务相关记录','排除已经做过高新服务或已注销客户'];
const samples=[
{name:'A科技有限公司',level:'高',why:'软件开发行业；有研发费用；聊天中提到研发项目。'},
{name:'B软件服务公司',level:'高',why:'经营范围含软件开发；有软件著作权；技术服务发票较多。'},
{name:'C智能制造公司',level:'中',why:'制造行业；经营范围含研发；但研发费用还没看到。'},
{name:'D商贸服务公司',level:'不建议',why:'只有“技术咨询”字样，主营更像普通商贸，容易误判。'}
];
function setGoal(t){document.getElementById('goal').value=t}
function renderRules(){document.getElementById('rules').innerHTML=ruleTexts.map((x,i)=>`<div class='rule'><div class='ruleText'><b>条件${i+1}</b>${x}</div><button class='edit' onclick='openEdit()'>改</button></div>`).join('')}
function renderSamples(){document.getElementById('sample').innerHTML=samples.map((x,i)=>`<div class='cust'><div class='custTop'><div class='custName'>${x.name}</div><span class='tag ${x.level==='高'?'high':x.level==='中'?'mid':'ok'}'>${x.level}</span></div><div class='why'>${x.why}</div><div class='feedback'><button onclick='mark(this,"准")'>准</button><button onclick='mark(this,"不准")'>不准</button><button onclick='mark(this,"先不跟")'>先不跟</button></div></div>`).join('')}
function generate(){document.getElementById('empty').style.display='none';document.getElementById('result').classList.add('show');document.getElementById('status').textContent='已生成，可先看样例';renderRules();renderSamples();toast('AI已生成筛选条件')}
function runSample(){renderSamples();toast('已抽取4家样例客户')}
function openEdit(){drawer(true)}function drawer(s){document.getElementById('drawer').classList.toggle('show',s)}
function applyEdit(){ruleTexts[0]='行业像：'+document.getElementById('industry').value;ruleTexts[1]='出现关键词：'+document.getElementById('words').value;ruleTexts[3]='排除：'+document.getElementById('exclude').value;renderRules();drawer(false);toast('条件已更新')}
function saveRule(){document.getElementById('saved').classList.add('show');document.getElementById('status').textContent='已保存为我的规则';toast('已保存成我的规则')}
function mark(btn,text){btn.parentElement.querySelectorAll('button').forEach(b=>b.style.background='#fff');btn.style.background='#eef4ff';toast('已标记：'+text)}
function toast(t){const el=document.getElementById('toast');el.textContent=t;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),1800)}
</script>
</body>
</html>
