<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>规则效果看板</title>
<style>
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei";background:#f5f7fb}
.wrap{padding:24px}
.card{background:#fff;border-radius:16px;padding:16px;margin-bottom:14px;border:1px solid #e5e7eb}
.title{font-size:22px;font-weight:900}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.m{background:#f8fafc;padding:12px;border-radius:14px}
.m b{font-size:22px}
</style>
</head>
<body>
<div class="wrap">
<div class="card">
<div class="title">规则效果总览</div>
</div>
<div class="grid">
<div class="m"><b>12</b><div>已启用规则</div></div>
<div class="m"><b>1,280</b><div>命中客户</div></div>
<div class="m"><b>18%</b><div>平均转化率</div></div>
<div class="m"><b>¥3.2M</b><div>预估贡献收入</div></div>
</div>
<div class="card">
<b>规则对比</b>
<div style='margin-top:10px'>高新规则转化率最高，但覆盖较窄；涨价规则贡献收入最大。</div>
</div>
</div>
</body>
</html>
