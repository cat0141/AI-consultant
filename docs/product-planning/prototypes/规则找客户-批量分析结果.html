<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>规则找客户 - AI增长操作系统原型</title>
<style>
:root{--bg:#f5f7fb;--panel:#fff;--line:#e5e7eb;--text:#111827;--muted:#64748b;--blue:#2563eb;--blueSoft:#eef4ff;--green:#16a34a;--greenSoft:#ecfdf3;--orange:#f59e0b;--orangeSoft:#fff7e6;--red:#ef4444;--redSoft:#fff1f2;--purple:#7c3aed;--purpleSoft:#f3edff;--shadow:0 18px 48px rgba(15,23,42,.10);--r:16px}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Arial,sans-serif;color:var(--text);font-size:14px}.app{height:100vh;display:grid;grid-template-columns:260px minmax(760px,1fr);overflow:hidden}.rules{background:#f8fafc;border-right:1px solid var(--line);display:flex;flex-direction:column}.ruleHead{height:68px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 18px}.ruleHead b{font-size:18px}.ruleHead small{display:block;color:var(--muted);margin-top:3px}.ruleList{padding:14px;overflow:auto}.ruleCard{background:#fff;border:1px solid transparent;border-radius:15px;padding:13px;margin-bottom:10px;cursor:pointer;transition:.18s}.ruleCard:hover{border-color:#cbd5e1;box-shadow:0 8px 18px rgba(15,23,42,.05)}.ruleCard.active{border-color:#93c5fd;background:#f7fbff;box-shadow:0 8px 20px rgba(37,99,235,.10)}.ruleName{font-weight:900;line-height:1.35}.ruleDesc{font-size:12px;color:#64748b;line-height:1.55;margin-top:6px}.ruleMeta{display:flex;justify-content:space-between;align-items:center;margin-top:10px}.badge{display:inline-flex;border-radius:999px;padding:4px 8px;font-size:12px;font-weight:900;white-space:nowrap}.blue{background:var(--blueSoft);color:var(--blue)}.green{background:var(--greenSoft);color:var(--green)}.orange{background:var(--orangeSoft);color:#b45309}.red{background:var(--redSoft);color:#dc2626}.purple{background:var(--purpleSoft);color:var(--purple)}.main{min-width:0;display:flex;flex-direction:column}.top{height:68px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 22px}.pageTitle{font-weight:900;font-size:18px}.sub{font-size:12px;color:var(--muted);margin-top:4px}.btn{border:1px solid transparent;border-radius:12px;height:38px;padding:0 13px;display:inline-flex;align-items:center;gap:7px;cursor:pointer;font-weight:800;font-family:inherit;white-space:nowrap}.primary{background:var(--blue);color:#fff}.secondary{background:#fff;border-color:var(--line);color:#334155}.soft{background:var(--blueSoft);color:var(--blue)}.success{background:var(--green);color:#fff}.content{flex:1;overflow:auto;padding:20px}.summary{background:linear-gradient(135deg,#fff,#edf4ff);border:1px solid #e0e7ff;border-radius:20px;padding:18px;display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:16px;box-shadow:0 8px 24px rgba(15,23,42,.045)}.summary h1{font-size:22px;margin:0 0 6px}.summary p{margin:0;color:#475569;line-height:1.65}.metrics{display:grid;grid-template-columns:repeat(4,96px);gap:9px}.metric{background:rgba(255,255,255,.82);border:1px solid #dbeafe;border-radius:14px;padding:10px;text-align:center}.metric b{font-size:22px}.metric span{display:block;color:var(--muted);font-size:12px;margin-top:3px}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:14px}.filters{display:flex;gap:8px;flex-wrap:wrap}.select,.input{height:36px;border:1px solid var(--line);border-radius:11px;padding:0 11px;background:#fff;outline:none;font-family:inherit}.input{width:240px}.resultGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.custCard{background:#fff;border:1px solid var(--line);border-radius:17px;padding:14px;cursor:pointer;transition:.18s}.custCard:hover{border-color:#9fc0ff;box-shadow:0 12px 26px rgba(37,99,235,.10)}.custTop{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.custName{font-size:16px;font-weight:900}.custSub{font-size:12px;color:#64748b;margin-top:5px;line-height:1.55}.tagRow{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.tag{background:#f1f5f9;color:#475569;border-radius:999px;padding:4px 7px;font-size:12px}.reasonLine{margin-top:10px;color:#334155;line-height:1.55}.cardActions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}.mini{height:32px;font-size:12px;border-radius:10px;padding:0 10px}.drawerMask{position:fixed;inset:0;background:rgba(15,23,42,.18);opacity:0;pointer-events:none;transition:.2s;z-index:10}.drawerMask.show{opacity:1;pointer-events:auto}.drawer{position:fixed;top:0;right:0;width:520px;max-width:96vw;height:100vh;background:#fff;box-shadow:-20px 0 48px rgba(15,23,42,.18);transform:translateX(104%);transition:.24s;z-index:11;display:flex;flex-direction:column}.drawer.show{transform:translateX(0)}.drawerHead{height:68px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 18px}.drawerTitle{font-weight:900;font-size:17px}.drawerBody{flex:1;overflow:auto;padding:18px}.scoreBox{height:102px;border-radius:18px;background:linear-gradient(135deg,#2563eb,#7c3aed);color:#fff;padding:18px;display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.scoreBox strong{font-size:40px}.section{font-weight:900;margin:18px 0 10px}.infoTable{width:100%;border-collapse:separate;border-spacing:0;border:1px solid var(--line);border-radius:14px;overflow:hidden}.infoTable td{padding:10px;border-bottom:1px solid #edf0f5;line-height:1.55}.infoTable tr:last-child td{border-bottom:0}.infoTable td:first-child{background:#f8fafc;color:#64748b;font-size:12px;width:98px}.evidence{display:grid;gap:9px}.evi{border:1px solid var(--line);border-radius:14px;padding:11px;line-height:1.6}.evi b{display:block;margin-bottom:3px}.talk{background:#f5f3ff;color:#5b21b6;border:1px solid #ddd6fe;border-radius:14px;padding:12px;line-height:1.7}.phonePreview{border:1px solid #dbeafe;background:#f8fbff;border-radius:16px;padding:12px}.phoneCard{background:#fff;border:1px solid #bfdbfe;border-radius:14px;overflow:hidden;margin-top:10px}.phoneCardHead{background:linear-gradient(135deg,#2563eb,#4f46e5);color:#fff;padding:11px}.phoneCardBody{padding:11px;line-height:1.65}.drawerFooter{border-top:1px solid var(--line);padding:12px 18px;display:flex;gap:8px;justify-content:flex-end;background:#fff}.toast{position:fixed;left:50%;top:22px;transform:translateX(-50%) translateY(-20px);opacity:0;background:#0f172a;color:#fff;padding:12px 16px;border-radius:999px;box-shadow:var(--shadow);transition:.2s;z-index:30}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}@media(max-width:980px){.app{grid-template-columns:1fr;height:auto;overflow:auto}.rules{height:auto}.resultGrid{grid-template-columns:1fr}.summary{display:block}.metrics{margin-top:12px;grid-template-columns:repeat(2,1fr)}.drawer{width:100vw}.toolbar{display:block}.filters{margin-top:8px}.input{width:100%}}
</style>
</head>
<body>
<div class="app">
  <aside class="rules">
    <div class="ruleHead"><div><b>规则找客户</b><small>选择规则，查看命中结果</small></div></div>
    <div class="ruleList" id="ruleList"></div>
  </aside>

  <main class="main">
    <header class="top">
      <div><div class="pageTitle" id="pageTitle">高新申报客户</div><div class="sub">规则结果只负责分析和建议；后续动作由顾问自行决定。</div></div>
      <button class="btn primary" onclick="sendCurrentToPhone()">发送当前客户到手机</button>
    </header>
    <div class="content">
      <section class="summary">
        <div><h1 id="summaryTitle">高新申报客户</h1><p id="summaryDesc">根据行业、经营范围、研发费用、知识产权和聊天关键词，找出适合先做高新申报评估的客户。</p></div>
        <div class="metrics"><div class="metric"><b id="mAll">0</b><span>命中客户</span></div><div class="metric"><b id="mHigh">0</b><span>高推荐</span></div><div class="metric"><b id="mMid">0</b><span>中推荐</span></div><div class="metric"><b id="mLow">0</b><span>低推荐</span></div></div>
      </section>
      <div class="toolbar">
        <div class="filters"><select class="select" id="level" onchange="renderResults()"><option value="all">全部推荐</option><option value="高">高推荐</option><option value="中">中推荐</option><option value="低">低推荐</option></select><input class="input" id="kw" oninput="renderResults()" placeholder="搜索客户/命中原因" /></div>
        <div class="filters"><button class="btn soft" onclick="toast('已按推荐程度排序')">推荐程度排序</button><button class="btn secondary" onclick="toast('已导出当前结果')">导出结果</button></div>
      </div>
      <div class="resultGrid" id="resultGrid"></div>
    </div>
  </main>
</div>

<div class="drawerMask" id="mask" onclick="closeDrawer()"></div>
<aside class="drawer" id="drawer">
  <div class="drawerHead"><div><div class="drawerTitle" id="dName">客户详情</div><div class="sub" id="dSub"></div></div><button class="btn secondary" onclick="closeDrawer()">关闭</button></div>
  <div class="drawerBody" id="drawerBody"></div>
  <div class="drawerFooter"><button class="btn secondary" onclick="copyTalk()">复制话术</button><button class="btn primary" onclick="sendCurrentToPhone()">发送到顾问手机</button></div>
</aside>
<div class="toast" id="toast"></div>
<script>
const rules=[
{id:'hightech',name:'高新申报客户',desc:'找适合先做高新评估的客户',type:'系统规则',summary:'根据行业、经营范围、研发费用、知识产权和聊天关键词，找出适合先做高新申报评估的客户。',data:[
{name:'A科技有限公司',level:'高',score:92,industry:'软件开发',advisor:'张三',evidence:['行业为软件开发，属于高新申报常见行业','经营范围包含“技术开发、软件开发”','研发费用18.6万，近12个月收入较高','聊天中客户提到“今年研发项目比较多”'],finance:['近12个月收入：860万','研发费用：18.6万','技术服务发票：6张','知识产权：2项'],chat:['客户问：今年有几个研发项目，做账需要注意什么？','客户问：软件著作权和项目申报有关系吗？'],talk:'王总，看到贵司今年研发投入和技术服务业务都有增长，可以先做一次高新申报条件评估，判断是否具备申报基础。'},
{name:'B软件服务公司',level:'高',score:89,industry:'信息技术',advisor:'张三',evidence:['经营范围含软件开发','有软件著作权2项','技术服务发票多次出现'],finance:['近12个月收入：520万','知识产权：2项','技术服务发票：4张'],chat:['客户问：软件著作权费用怎么入账？'],talk:'王总，贵司有软件著作权和技术服务业务，可以先看下是否具备高新申报基础。'},
{name:'C智能制造公司',level:'中',score:76,industry:'制造业',advisor:'李四',evidence:['制造行业匹配','经营范围含研发','研发费用字段暂未看到'],finance:['近12个月收入：1200万','研发费用：暂无明确记录','设备类发票较多'],chat:['客户提到新产品试制，但未明确研发项目。'],talk:'王总，看到贵司经营范围里有研发相关内容，可以确认下今年是否有研发项目。'},
{name:'D商贸服务公司',level:'低',score:58,industry:'商贸服务',advisor:'王五',evidence:['经营范围有“技术咨询”字样','主营行业更像普通商贸，容易误判'],finance:['近12个月收入：310万','研发费用：无','技术服务发票：1张'],chat:['暂无明确高新相关沟通。'],talk:'这家客户暂不建议主动联系，可等客户有明确研发或项目需求时再跟进。'}]},
{id:'price',name:'涨价沟通客户',desc:'找服务量上升、价格偏低的客户',type:'企业规则',summary:'根据当前服务价格、凭证量、流水量、咨询次数和服务年限，找出适合做服务复盘或涨价沟通的客户。',data:[
{name:'B商贸有限公司',level:'高',score:88,industry:'商贸批发',advisor:'张三',evidence:['当前收费低于机构均价','近12个月凭证和流水明显增加','客户咨询次数较高'],finance:['当前价格：260元/月','机构同类均价：420元/月','近12个月凭证：1246张','咨询次数：118次'],chat:['客户说：最近业务量上来了，后面可能每个月都差不多。'],talk:'李总，您公司今年业务量和票据量都有明显增加，我们这边服务工作量也相应提升，建议近期一起复盘当前服务内容和费用标准。'},
{name:'F餐饮管理公司',level:'中',score:74,industry:'餐饮',advisor:'李四',evidence:['流水增长较快','咨询高频','当前价格偏低'],finance:['当前价格：300元/月','流水条数增长：42%','咨询次数：86次'],chat:['客户多次询问发票和流水用途。'],talk:'李总，近期业务量上升，我们可以帮您看下是否需要升级服务套餐。'}]},
{id:'ads',name:'广告投放客户',desc:'找有营销投放行为的客户',type:'企业规则',summary:'根据发票项目、供应商名称和费用金额，找出可能有广告投放或数字营销需求的客户。',data:[
{name:'C传媒有限公司',level:'高',score:91,industry:'文化传媒',advisor:'张三',evidence:['发票命中信息流投放','近半年营销类金额42.8万','供应商多为广告公司'],finance:['营销类发票：12张','营销金额：42.8万','供应商：广告/网络科技类'],chat:['客户问：上个月广告公司的票都到了吗？'],talk:'赵总，看到贵司近期有广告投放，如果关注投放效果或获客成本，我们可以先帮您做一次营销投入梳理。'}]},
{id:'change',name:'工商变更客户',desc:'找聊天里提到变更的客户',type:'AI草稿',summary:'根据云微聊天关键词和工商状态，找出可能需要股东、法人、地址变更服务的客户。',data:[
{name:'D实业有限公司',level:'中',score:68,industry:'实业投资',advisor:'王五',evidence:['聊天中提到股东调整','工商记录暂无同步变更'],finance:['工商状态：正常','最近变更：2025-12-08'],chat:['客户问：如果后面股东调整，流程麻烦吗？'],talk:'周总，您之前提到股东调整，如果后续确定方案，可以提前准备材料，我们可以协助您评估办理流程。'}]}
];
let currentRule=rules[0];let currentCustomer=currentRule.data[0];
function levelCls(l){return l==='高'?'red':l==='中'?'orange':'green'}
function renderRules(){document.getElementById('ruleList').innerHTML=rules.map(r=>`<div class="ruleCard ${r.id===currentRule.id?'active':''}" onclick="selectRule('${r.id}')"><div class="ruleName">${r.name}</div><div class="ruleDesc">${r.desc}</div><div class="ruleMeta"><span class="badge blue">${r.type}</span><span class="sub">${r.data.length} 家</span></div></div>`).join('')}
function selectRule(id){currentRule=rules.find(r=>r.id===id);currentCustomer=currentRule.data[0];document.getElementById('pageTitle').textContent=currentRule.name;document.getElementById('summaryTitle').textContent=currentRule.name;document.getElementById('summaryDesc').textContent=currentRule.summary;document.getElementById('level').value='all';document.getElementById('kw').value='';renderRules();renderResults();closeDrawer();toast('已切换规则：'+currentRule.name)}
function renderResults(){const lv=document.getElementById('level').value;const kw=document.getElementById('kw').value.trim();const arr=currentRule.data.filter(x=>(lv==='all'||x.level===lv)&&(!kw||x.name.includes(kw)||x.evidence.join('').includes(kw)||x.chat.join('').includes(kw)));document.getElementById('mAll').textContent=currentRule.data.length;document.getElementById('mHigh').textContent=currentRule.data.filter(x=>x.level==='高').length;document.getElementById('mMid').textContent=currentRule.data.filter(x=>x.level==='中').length;document.getElementById('mLow').textContent=currentRule.data.filter(x=>x.level==='低').length;document.getElementById('resultGrid').innerHTML=arr.map(c=>`<div class="custCard" onclick="openDetail('${c.name}')"><div class="custTop"><div><div class="custName">${c.name}</div><div class="custSub">${c.industry} · 顾问：${c.advisor}</div></div><span class="badge ${levelCls(c.level)}">${c.level}推荐</span></div><div class="tagRow">${c.evidence.slice(0,3).map(e=>`<span class="tag">${e.length>14?e.slice(0,14)+'…':e}</span>`).join('')}</div><div class="reasonLine">${c.evidence[0]}</div><div class="cardActions"><button class="btn mini soft" onclick="event.stopPropagation();openDetail('${c.name}')">看详情</button><button class="btn mini primary" onclick="event.stopPropagation();quickSend('${c.name}')">发送到手机</button></div></div>`).join('')}
function openDetail(name){currentCustomer=currentRule.data.find(c=>c.name===name);document.getElementById('dName').textContent=currentCustomer.name;document.getElementById('dSub').textContent=currentRule.name+' · '+currentCustomer.industry+' · 顾问：'+currentCustomer.advisor;document.getElementById('drawerBody').innerHTML=`<div class="scoreBox"><div><div>推荐程度：${currentCustomer.level}推荐</div><div style="opacity:.8;margin-top:5px">规则：${currentRule.name}</div></div><strong>${currentCustomer.score}</strong></div><div class="section">客户基础信息</div><table class="infoTable"><tr><td>客户名称</td><td>${currentCustomer.name}</td></tr><tr><td>行业</td><td>${currentCustomer.industry}</td></tr><tr><td>负责顾问</td><td>${currentCustomer.advisor}</td></tr><tr><td>推荐等级</td><td>${currentCustomer.level}推荐</td></tr></table><div class="section">命中证据</div><div class="evidence">${currentCustomer.evidence.map((e,i)=>`<div class="evi"><b>证据${i+1}</b>${e}</div>`).join('')}</div><div class="section">财税/业务数据</div><div class="evidence">${currentCustomer.finance.map(e=>`<div class="evi">${e}</div>`).join('')}</div><div class="section">聊天线索</div><div class="evidence">${currentCustomer.chat.map(e=>`<div class="evi">${e}</div>`).join('')}</div><div class="section">AI建议话术</div><div class="talk">${currentCustomer.talk}</div><div class="section">发送到手机预览</div><div class="phonePreview">发送后，顾问会在企业微信收到一张小程序卡片。<div class="phoneCard"><div class="phoneCardHead"><b>${currentCustomer.name}</b><div style="font-size:12px;opacity:.85">${currentRule.name} · ${currentCustomer.level}推荐</div></div><div class="phoneCardBody"><b>为什么推荐：</b><br>${currentCustomer.evidence[0]}<br><br><b>建议话术：</b><br>${currentCustomer.talk}</div></div></div>`;document.getElementById('drawer').classList.add('show');document.getElementById('mask').classList.add('show')}
function closeDrawer(){document.getElementById('drawer').classList.remove('show');document.getElementById('mask').classList.remove('show')}
function sendCurrentToPhone(){if(!currentCustomer){toast('请先选择客户');return}toast('AI已通过企业微信发送到 '+currentCustomer.advisor+' 的手机')}
function quickSend(name){currentCustomer=currentRule.data.find(c=>c.name===name);toast('AI已通过企业微信发送到 '+currentCustomer.advisor+' 的手机')}
function copyTalk(){toast('话术已复制')}
function toast(t){const el=document.getElementById('toast');el.textContent=t;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),1900)}
renderRules();selectRule('hightech');
</script>
</body>
</html>
