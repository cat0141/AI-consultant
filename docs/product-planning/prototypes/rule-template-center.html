<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>规则模板中心</title>
<style>
:root{--bg:#f5f7fb;--panel:#fff;--line:#e5e7eb;--text:#111827;--muted:#64748b;--primary:#2563eb;--soft:#eaf1ff;--green:#16a34a;--greenSoft:#ecfdf3;--orange:#f59e0b;--orangeSoft:#fff7e7;--purple:#7c3aed;--purpleSoft:#f3edff;--shadow:0 16px 38px rgba(15,23,42,.08);--r:16px}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Arial,sans-serif;color:var(--text)}.app{display:flex;min-height:100vh}.side{width:240px;background:#0f172a;color:#cbd5e1;padding:20px}.main{flex:1}.top{height:64px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 24px}.page{padding:24px}.hero{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:14px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;cursor:pointer}.title{font-weight:900;font-size:18px}.muted{color:var(--muted);font-size:12px}.tag{display:inline-flex;padding:4px 8px;border-radius:999px;font-size:12px;font-weight:800;background:var(--soft);color:var(--primary);margin-right:6px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:10px}.s{background:#f8fafc;border-radius:12px;padding:10px;text-align:center}.s b{font-size:20px}
</style>
</head>
<body>
<div class="app">
<div class="side">AI增长OS</div>
<div class="main">
<div class="top"><b>规则模板中心</b></div>
<div class="page">
<div class="hero">
<div class="title">规则资产中心</div>
<div class="muted">统一管理：系统模板 / 企业规则 / AI草稿（不展示成交数据，仅展示使用效果与反馈）</div>
</div>

<div class="grid" id="grid"></div>
</div>
</div>
</div>
<script>
const data=[
{name:'高新申报规则',type:'通用',usage:1260,accept:'42%',feedback:'高',note:'用于识别高新申报潜力客户'},
{name:'涨价沟通规则',type:'通用',usage:2080,accept:'35%',feedback:'中',note:'识别服务负载上升客户'},
{name:'广告营销规则',type:'企业',usage:960,accept:'28%',feedback:'中',note:'识别营销投放行为客户'},
{name:'工商变更规则',type:'AI草稿',usage:480,accept:'51%',feedback:'高',note:'识别工商变更意图'}
];
function render(){document.getElementById('grid').innerHTML=data.map(x=>`<div class='card'><div><span class='tag'>${x.type}</span><b>${x.name}</b></div><div class='muted'>${x.note}</div><div class='stats'><div class='s'><b>${x.usage}</b><div class='muted'>使用次数</div></div><div class='s'><b>${x.accept}</b><div class='muted'>采纳率</div></div><div class='s'><b>${x.feedback}</b><div class='muted'>反馈质量</div></div><div class='s'><b>优化中</b><div class='muted'>状态</div></div></div></div>`).join('')}render();
</script>
</body>
</html>
