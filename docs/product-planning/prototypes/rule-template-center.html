<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>规则模板中心 - AI增长操作系统原型</title>
  <style>
    :root{--bg:#f5f7fb;--panel:#fff;--line:#e5e7eb;--text:#111827;--muted:#64748b;--primary:#2563eb;--soft:#eaf1ff;--green:#16a34a;--greenSoft:#eaf8ef;--orange:#f59e0b;--orangeSoft:#fff7e6;--red:#ef4444;--redSoft:#fff1f2;--purple:#7c3aed;--purpleSoft:#f3edff;--shadow:0 16px 38px rgba(15,23,42,.08);--r:16px}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Arial,sans-serif;color:var(--text);font-size:14px}.app{display:flex;min-height:100vh}.side{width:248px;background:#0f172a;color:#cbd5e1;padding:22px 16px}.logo{display:flex;gap:10px;align-items:center;margin-bottom:26px}.mark{width:36px;height:36px;border-radius:12px;background:linear-gradient(135deg,#2563eb,#7c3aed);display:grid;place-items:center;color:#fff;font-weight:900}.logo b{color:#fff}.logo small{display:block;color:#93c5fd;margin-top:2px}.navt{font-size:12px;color:#94a3b8;margin:22px 10px 8px}.nav{height:42px;border-radius:12px;display:flex;align-items:center;gap:10px;padding:0 12px;margin-bottom:6px;cursor:pointer}.nav.active{background:rgba(37,99,235,.18);color:#fff;border:1px solid rgba(147,197,253,.22)}.main{flex:1}.top{height:68px;background:rgba(255,255,255,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:5}.crumb{color:var(--muted);font-size:13px}.btn{border:1px solid transparent;border-radius:12px;height:38px;padding:0 14px;display:inline-flex;align-items:center;gap:7px;cursor:pointer;font-weight:750;font-family:inherit;white-space:nowrap}.primary{background:var(--primary);color:#fff}.secondary{background:#fff;border-color:var(--line);color:#334155}.soft{background:var(--soft);color:var(--primary)}.green{background:var(--green);color:#fff}.page{padding:28px}.hero{background:linear-gradient(135deg,#fff,#edf4ff 60%,#f7f2ff);border:1px solid #e3e8f4;border-radius:22px;padding:24px;box-shadow:var(--shadow);margin-bottom:20px;display:flex;justify-content:space-between;gap:22px}.hero h1{margin:0 0 8px;font-size:26px}.hero p{margin:0;color:#475569;line-height:1.7}.heroCards{display:grid;grid-template-columns:repeat(4,116px);gap:10px}.metric{background:rgba(255,255,255,.85);border:1px solid #dbe5f5;border-radius:16px;padding:12px}.metric b{font-size:24px}.metric span{display:block;color:var(--muted);font-size:12px;margin-top:4px}.toolbar{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;justify-content:space-between;gap:14px;align-items:center;margin-bottom:18px;box-shadow:0 8px 24px rgba(15,23,42,.04)}.filters{display:flex;gap:9px;flex-wrap:wrap}.input,.select{height:38px;border:1px solid var(--line);border-radius:12px;padding:0 12px;background:#fff;outline:none;font-family:inherit}.input{width:260px}.tabs{display:flex;gap:8px}.tab{border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 12px;cursor:pointer;color:#475569;font-weight:700}.tab.active{background:var(--soft);border-color:#bcd1ff;color:var(--primary)}.grid{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:18px}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:0 8px 24px rgba(15,23,42,.045);overflow:hidden}.tpl{padding:16px;cursor:pointer;transition:.18s}.tpl:hover{border-color:#bcd1ff;box-shadow:0 12px 26px rgba(37,99,235,.08)}.tpl.selected{border-color:#8db2ff;background:#f7faff}.tplHead{display:flex;justify-content:space-between;gap:12px;margin-bottom:10px}.tplName{font-weight:900;font-size:16px}.desc{color:var(--muted);font-size:12px;line-height:1.55;margin-top:5px}.badge{border-radius:999px;padding:5px 8px;font-size:12px;font-weight:800;white-space:nowrap}.blue{background:var(--soft);color:var(--primary)}.greenB{background:var(--greenSoft);color:var(--green)}.orange{background:var(--orangeSoft);color:#b45309}.purple{background:var(--purpleSoft);color:var(--purple)}.red{background:var(--redSoft);color:#dc2626}.tagRow{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}.tag{background:#f1f5f9;color:#475569;border-radius:999px;padding:4px 7px;font-size:12px}.tplStats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;border-top:1px solid #edf0f5;padding-top:12px;margin-top:12px}.s{text-align:center}.s b{display:block}.s span{color:var(--muted);font-size:11px}.detail{background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:0 8px 24px rgba(15,23,42,.045);overflow:hidden;position:sticky;top:88px}.detailH{padding:18px;border-bottom:1px solid var(--line)}.detailB{padding:18px}.dTitle{font-weight:900;font-size:18px}.section{font-weight:850;margin:18px 0 10px}.ruleBox{border:1px solid var(--line);border-radius:14px;overflow:hidden}.ruleLine{display:grid;grid-template-columns:86px 1fr;border-bottom:1px solid #edf0f5}.ruleLine:last-child{border-bottom:0}.ruleLine span:first-child{background:#f8fafc;color:#64748b;font-size:12px;padding:10px}.ruleLine span:last-child{padding:10px;line-height:1.55}.timeline{display:grid;gap:10px}.tl{border:1px solid var(--line);border-radius:12px;padding:10px;line-height:1.55}.tl b{display:block}.tl small{color:var(--muted)}.drawer{position:fixed;right:28px;bottom:28px;width:420px;background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);opacity:0;transform:translateY(20px);pointer-events:none;transition:.22s;z-index:20}.drawer.show{opacity:1;transform:translateY(0);pointer-events:auto}.drawerH{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;font-weight:850}.drawerB{padding:16px 18px;line-height:1.7}.formGrid{display:grid;gap:10px}.formGrid label{font-weight:750}.textarea{width:100%;min-height:86px;border:1px solid var(--line);border-radius:12px;padding:10px;resize:vertical;font-family:inherit}.toast{position:fixed;left:50%;top:22px;transform:translateX(-50%) translateY(-20px);opacity:0;background:#0f172a;color:#fff;padding:12px 16px;border-radius:999px;box-shadow:var(--shadow);transition:.2s;z-index:30}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}@media(max-width:1180px){.side{display:none}.grid{grid-template-columns:1fr}.cards{grid-template-columns:1fr}.hero{display:block}.heroCards{margin-top:16px;grid-template-columns:repeat(2,1fr)}.detail{position:static}}
  </style>
</head>
<body><div class="app"><aside class="side"><div class="logo"><div class="mark">AI</div><div><b>AI增长操作系统</b><small>Growth OS</small></div></div><div class="navt">增长工作台</div><div class="nav">✦ AI规则助手</div><div class="nav active">▦ 规则模板中心</div><div class="nav">◎ 批量分析</div><div class="nav">☑ 行动建议</div><div class="navt">运营沉淀</div><div class="nav">▣ 规则效果看板</div></aside><main class="main"><header class="top"><div><div class="crumb">产品原型 / AI增长操作系统 / 规则模板中心</div><div style="font-weight:800;margin-top:4px">通用规则与企业内部规则沉淀</div></div><div style="display:flex;gap:10px"><button class="btn secondary" onclick="openImport()">导入规则</button><button class="btn primary" onclick="openCreate()">新建规则</button></div></header><div class="page"><section class="hero"><div><h1>规则模板中心</h1><p>统一管理系统预置规则、AI生成草稿、企业内部规则和已验证高转化规则。让增长经验沉淀为可复用资产。</p></div><div class="heroCards"><div class="metric"><b>32</b><span>系统模板</span></div><div class="metric"><b>18</b><span>企业内部规则</span></div><div class="metric"><b>9</b><span>AI草稿</span></div><div class="metric"><b>6</b><span>高转化模板</span></div></div></section><div class="toolbar"><div class="filters"><input class="input" id="kw" oninput="render()" placeholder="搜索规则名称/场景/标签"><select class="select" id="scene" onchange="render()"><option value="all">全部场景</option><option>高新申报</option><option>涨价沟通</option><option>广告营销</option><option>工商变更</option><option>合规体检</option></select></div><div class="tabs"><button class="tab active" onclick="setType('all',this)">全部</button><button class="tab" onclick="setType('通用',this)">通用模板</button><button class="tab" onclick="setType('企业内部',this)">企业内部</button><button class="tab" onclick="setType('AI草稿',this)">AI草稿</button></div></div><div class="grid"><section><div class="cards" id="cards"></div></section><aside class="detail"><div class="detailH"><div class="dTitle" id="dName"></div><div class="desc" id="dDesc"></div></div><div class="detailB" id="detailB"></div></aside></div></div></main></div><div class="drawer" id="drawer"><div class="drawerH"><span id="drawerTitle">新建规则</span><span style="color:#2563eb;cursor:pointer" onclick="drawer(false)">关闭</span></div><div class="drawerB"><div class="formGrid"><label>用自然语言描述你想找的客户</label><textarea class="textarea" id="aiInput">帮我找近期可能需要工商变更的客户</textarea><button class="btn primary" onclick="genDraft()">AI生成规则草稿</button><div id="draftBox" style="display:none;border:1px solid var(--line);border-radius:14px;padding:12px;background:#f8fafc"><b>AI已生成草稿：</b><br>规则名称：工商变更意图客户<br>必须条件：在服客户<br>任一条件：聊天包含“股东调整/法人变更/地址搬迁”<br>排除条件：近30天已办理工商变更</div><button class="btn green" onclick="saveDraft()">保存为AI草稿</button></div></div></div><div class="toast" id="toast"></div><script>
const data=[
{name:'高新申报潜力客户',scene:'高新申报',type:'通用',status:'已启用',desc:'识别适合做高新申报、研发费用归集、知识产权辅导的客户。',tags:['研发费用','技术开发','知识产权'],hit:126,adopt:'42%',intent:'18%',deal:6,rule:['行业属于科技/软件/制造/环保','经营范围含技术开发/软件开发/研发','存在研发费用或知识产权','排除已成交高新服务客户']},
{name:'可涨价代账客户',scene:'涨价沟通',type:'通用',status:'已启用',desc:'识别服务复杂度上升、当前单价偏低、适合做涨价沟通的客户。',tags:['低价高耗','高票量','服务复杂'],hit:208,adopt:'35%',intent:'12%',deal:5,rule:['当前价格低于机构均价','服务时长超过1年','凭证/流水/咨询次数较高','排除已涨价客户']},
{name:'广告投放客户',scene:'广告营销',type:'企业内部',status:'验证中',desc:'基于发票和往来科目识别有广告投放习惯的客户。',tags:['信息流','品牌推广','网络科技'],hit:96,adopt:'28%',intent:'10%',deal:2,rule:['发票项目命中广告/信息流/SEO','供应商包含传媒/网络科技','营销金额达到阈值','排除同行客户']},
{name:'工商变更意图客户',scene:'工商变更',type:'AI草稿',status:'草稿',desc:'从云微聊天中识别股东、法人、地址等变更意图。',tags:['聊天识别','股东调整','地址搬迁'],hit:48,adopt:'51%',intent:'20%',deal:3,rule:['聊天包含股东调整/法人变更/地址搬迁','工商记录未同步变更','排除近30天已办理客户']},
{name:'合规体检客户',scene:'合规体检',type:'通用',status:'已启用',desc:'识别存在税负、毛利、暂估、零申报等风险信号的客户。',tags:['税负异常','暂估','零申报'],hit:156,adopt:'31%',intent:'11%',deal:4,rule:['存在暂估或长期零申报','税负率偏离行业区间','毛利率异常','排除已做体检客户']},
{name:'老板自定义重点客户',scene:'涨价沟通',type:'企业内部',status:'已启用',desc:'某机构老板基于本地业务经验创建的私有经营规则。',tags:['私有规则','高价值','老板经验'],hit:62,adopt:'64%',intent:'25%',deal:7,rule:['年收入大于500万','顾问评分高','服务价格低于指定阈值','老板手动标记重点行业']}
];let type='all';let cur=data[0];function badge(t){return t==='通用'?'blue':t==='企业内部'?'greenB':'purple'}function statusCls(s){return s==='已启用'?'greenB':s==='验证中'?'orange':'purple'}function render(){const cards=document.getElementById('cards');const kw=document.getElementById('kw').value.trim();const scene=document.getElementById('scene').value;let list=data.filter(x=>(type==='all'||x.type===type)&&(scene==='all'||x.scene===scene)&&(!kw||x.name.includes(kw)||x.tags.join('').includes(kw)||x.scene.includes(kw)));cards.innerHTML=list.map((x,i)=>`<div class="card tpl ${cur.name===x.name?'selected':''}" onclick="pick('${x.name}')"><div class="tplHead"><div><div class="tplName">${x.name}</div><div class="desc">${x.desc}</div></div><span class="badge ${badge(x.type)}">${x.type}</span></div><div class="tagRow">${x.tags.map(t=>`<span class="tag">${t}</span>`).join('')}</div><span class="badge ${statusCls(x.status)}">${x.status}</span><div class="tplStats"><div class="s"><b>${x.hit}</b><span>命中</span></div><div class="s"><b>${x.adopt}</b><span>采纳</span></div><div class="s"><b>${x.intent}</b><span>意向</span></div><div class="s"><b>${x.deal}</b><span>成交</span></div></div></div>`).join('');renderDetail()}function pick(n){cur=data.find(x=>x.name===n);render()}function renderDetail(){document.getElementById('dName').textContent=cur.name;document.getElementById('dDesc').textContent=cur.desc;document.getElementById('detailB').innerHTML=`<div style="display:flex;gap:8px;margin-bottom:14px"><span class="badge ${badge(cur.type)}">${cur.type}</span><span class="badge ${statusCls(cur.status)}">${cur.status}</span><span class="badge blue">${cur.scene}</span></div><div class="section">规则条件</div><div class="ruleBox">${cur.rule.map((r,i)=>`<div class="ruleLine"><span>条件${i+1}</span><span>${r}</span></div>`).join('')}</div><div class="section">规则效果</div><div class="ruleBox"><div class="ruleLine"><span>命中客户</span><span>${cur.hit} 家</span></div><div class="ruleLine"><span>顾问采纳</span><span>${cur.adopt}</span></div><div class="ruleLine"><span>有兴趣率</span><span>${cur.intent}</span></div><div class="ruleLine"><span>成交数</span><span>${cur.deal} 单</span></div></div><div class="section">AI建议</div><div class="tl"><b>优化建议</b><small>${cur.type==='AI草稿'?'建议先用20-50家样本验证后再启用。':'当前规则可继续观察顾问反馈，命中噪音较高时增加排除条件。'}</small></div><div style="display:flex;gap:8px;margin-top:16px;flex-wrap:wrap"><button class="btn primary" onclick="toast('已进入批量分析')">运行分析</button><button class="btn secondary" onclick="toast('已复制规则')">复制规则</button><button class="btn soft" onclick="toast('已打开编辑器')">编辑</button></div>`}function setType(t,btn){type=t;document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));btn.classList.add('active');render()}function drawer(s){document.getElementById('drawer').classList.toggle('show',s)}function openCreate(){document.getElementById('drawerTitle').textContent='AI新建规则';drawer(true)}function openImport(){document.getElementById('drawerTitle').textContent='导入规则';drawer(true)}function genDraft(){document.getElementById('draftBox').style.display='block';toast('AI已生成规则草稿')}function saveDraft(){toast('已保存为AI草稿');drawer(false)}function toast(t){const el=document.getElementById('toast');el.textContent=t;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),1800)}render();</script></body></html>
