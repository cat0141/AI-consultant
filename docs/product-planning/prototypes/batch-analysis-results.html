<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>找出来的客户 - AI增长操作系统原型</title>
<style>
:root{--bg:#f5f7fb;--panel:#fff;--line:#e5e7eb;--text:#111827;--muted:#64748b;--blue:#2563eb;--blueSoft:#eef4ff;--green:#16a34a;--greenSoft:#ecfdf3;--orange:#f59e0b;--orangeSoft:#fff7e6;--red:#ef4444;--redSoft:#fff1f2;--purple:#7c3aed;--purpleSoft:#f3edff;--shadow:0 16px 42px rgba(15,23,42,.08);--r:18px}*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#eef4ff,#f8fafc);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Arial,sans-serif;color:var(--text)}.wrap{max-width:1220px;margin:0 auto;padding:28px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.title h1{margin:0 0 6px;font-size:28px}.title p{margin:0;color:#475569;line-height:1.7}.btn{border:1px solid transparent;border-radius:13px;height:40px;padding:0 14px;display:inline-flex;align-items:center;gap:7px;cursor:pointer;font-weight:800;font-family:inherit}.primary{background:var(--blue);color:#fff}.secondary{background:#fff;border-color:var(--line);color:#334155}.soft{background:var(--blueSoft);color:var(--blue)}.green{background:var(--green);color:#fff}.toolbar{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px;display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:14px;box-shadow:0 8px 22px rgba(15,23,42,.04)}.select,.input{height:38px;border:1px solid var(--line);border-radius:12px;padding:0 12px;background:#fff;outline:none;font-family:inherit}.input{width:230px}.grid{display:grid;grid-template-columns:1fr 380px;gap:18px;align-items:start}.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}.head{padding:18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.head b{font-size:17px}.head small{display:block;color:var(--muted);margin-top:5px}.list{display:grid;gap:10px;padding:14px}.item{border:1px solid var(--line);border-radius:16px;padding:14px;background:#fff;cursor:pointer}.item:hover,.item.active{border-color:#9ec0ff;background:#f8fbff}.itemTop{display:flex;justify-content:space-between;gap:12px}.name{font-weight:900;font-size:16px}.sub{color:#64748b;font-size:12px;margin-top:5px;line-height:1.5}.badge{display:inline-flex;border-radius:999px;padding:5px 8px;font-size:12px;font-weight:900;white-space:nowrap}.high{background:var(--redSoft);color:#dc2626}.mid{background:var(--orangeSoft);color:#b45309}.low{background:var(--greenSoft);color:var(--green)}.tagRow{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}.tag{background:#f1f5f9;color:#475569;border-radius:999px;padding:4px 7px;font-size:12px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.mini{height:32px;padding:0 10px;font-size:12px;border-radius:10px}.detail{padding:18px}.score{height:96px;border-radius:18px;background:linear-gradient(135deg,#2563eb,#7c3aed);color:#fff;padding:16px;margin:12px 0;display:flex;justify-content:space-between;align-items:center}.score strong{font-size:38px}.section{font-weight:900;margin:18px 0 10px}.why{display:flex;gap:8px;margin-bottom:9px;line-height:1.55;color:#334155}.dot{width:20px;height:20px;border-radius:50%;background:var(--blueSoft);color:var(--blue);display:grid;place-items:center;font-size:12px;font-weight:900;flex-shrink:0}.talk{background:#f5f3ff;color:#5b21b6;border:1px solid #ddd6fe;border-radius:14px;padding:12px;line-height:1.7}.notice{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:14px;color:#475569;line-height:1.7}.toast{position:fixed;left:50%;top:22px;transform:translateX(-50%) translateY(-20px);opacity:0;background:#0f172a;color:#fff;padding:12px 16px;border-radius:999px;box-shadow:var(--shadow);transition:.2s;z-index:30}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}@media(max-width:980px){.grid{grid-template-columns:1fr}.top,.toolbar{display:block}.toolbar>*{margin-top:8px}.input{width:100%}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="title">
      <h1>找出来的客户</h1>
      <p>这是顾问自己看的客户名单。重点不是“推送给谁”，而是把合适客户加入自己的今日跟进，或生成手机卡片。</p>
    </div>
    <button class="btn primary" onclick="addSelected()">加入我的今日跟进</button>
  </div>

  <div class="notice">当前规则：<b id="ruleNameText">高新申报客户</b>。AI已经帮你先筛了一遍，建议先看“高推荐”的客户。</div>

  <div class="toolbar">
    <div style="display:flex;gap:9px;flex-wrap:wrap">
      <select class="select" id="rule" onchange="changeRule()"><option>高新申报客户</option><option>涨价沟通客户</option><option>广告投放客户</option><option>工商变更客户</option></select>
      <select class="select" id="level" onchange="render()"><option value="all">全部</option><option value="高">只看高推荐</option><option value="中">只看中推荐</option><option value="低">只看低推荐</option></select>
      <input class="input" id="kw" placeholder="搜客户/原因" oninput="render()" />
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn soft" onclick="selectHigh()">选中高推荐</button>
      <button class="btn secondary" onclick="toast('已生成企微小程序卡片预览')">生成手机卡片</button>
    </div>
  </div>

  <div class="grid">
    <section class="card">
      <div class="head"><div><b>客户名单</b><small id="countText">共 0 家</small></div><span class="badge low" id="selText">已选 0 家</span></div>
      <div class="list" id="list"></div>
    </section>
    <aside class="card">
      <div class="head"><div><b>客户详情</b><small>看原因，再决定要不要跟</small></div></div>
      <div class="detail" id="detail"></div>
    </aside>
  </div>
</div>
<div class="toast" id="toast"></div>
<script>
const datasets={
'高新申报客户':[
{name:'A科技有限公司',level:'高',score:92,reason:['软件开发行业','有研发费用18.6万','聊天中提到研发项目'],talk:'王总，看到贵司今年研发投入和技术服务业务都有增长，可以先做一次高新申报条件评估。'},
{name:'B软件服务公司',level:'高',score:89,reason:['经营范围含软件开发','有软件著作权','技术服务发票较多'],talk:'王总，贵司有软件著作权和技术服务业务，可以先看下是否具备高新申报基础。'},
{name:'C智能制造公司',level:'中',score:76,reason:['制造行业','经营范围含研发','研发费用暂未看到'],talk:'王总，看到贵司经营范围里有研发相关内容，可以确认下今年是否有研发项目。'},
{name:'D商贸服务公司',level:'低',score:58,reason:['只有技术咨询字样','主营更像普通商贸'],talk:'这家先不建议主动跟进，可等客户有明确需求再联系。'}],
'涨价沟通客户':[
{name:'B商贸有限公司',level:'高',score:88,reason:['当前收费低于机构均价','凭证和流水明显增加','咨询次数较高'],talk:'李总，您公司今年业务量和票据量都有明显增加，建议近期一起复盘服务内容和费用标准。'},
{name:'F餐饮管理公司',level:'中',score:74,reason:['流水增长','咨询高频','当前价格偏低'],talk:'李总，近期业务量上升，我们可以帮您看下是否需要升级服务套餐。'}],
'广告投放客户':[
{name:'C传媒有限公司',level:'高',score:91,reason:['发票命中信息流投放','近半年营销类金额42.8万','供应商多为广告公司'],talk:'赵总，看到贵司近期有广告投放，如果关注投放效果，我们可以先帮您做一次营销投入梳理。'}],
'工商变更客户':[
{name:'D实业有限公司',level:'中',score:68,reason:['聊天中提到股东调整','工商记录暂无同步变更'],talk:'周总，您之前提到股东调整，如果后续确定方案，可以提前准备材料。'}]
};let rule='高新申报客户';let cur=datasets[rule][0];let selected=new Set();function cls(l){return l==='高'?'high':l==='中'?'mid':'low'}function render(){const lv=document.getElementById('level').value;const kw=document.getElementById('kw').value.trim();let arr=datasets[rule].filter(x=>(lv==='all'||x.level===lv)&&(!kw||x.name.includes(kw)||x.reason.join('').includes(kw)));document.getElementById('countText').textContent=`共 ${arr.length} 家`;document.getElementById('selText').textContent=`已选 ${selected.size} 家`;document.getElementById('list').innerHTML=arr.map((x,i)=>`<div class='item ${cur.name===x.name?'active':''}' onclick='pick("${x.name}")'><div class='itemTop'><div><div class='name'>${x.name}</div><div class='sub'>${x.reason[0]} · ${x.reason[1]||''}</div></div><span class='badge ${cls(x.level)}'>${x.level}推荐</span></div><div class='tagRow'>${x.reason.map(r=>`<span class='tag'>${r}</span>`).join('')}</div><div class='actions'><button class='btn mini soft' onclick='event.stopPropagation();toggle("${x.name}")'>${selected.has(x.name)?'取消选择':'选中'}</button><button class='btn mini secondary' onclick='event.stopPropagation();toast("已加入今日跟进")'>加入跟进</button></div></div>`).join('');renderDetail()}function pick(n){cur=datasets[rule].find(x=>x.name===n);render()}function renderDetail(){document.getElementById('detail').innerHTML=`<div style='font-weight:900;font-size:18px'>${cur.name}</div><div class='score'><div><div>推荐等级：${cur.level}推荐</div><div style='opacity:.8;margin-top:5px'>先看原因，再决定是否联系</div></div><strong>${cur.score}</strong></div><div class='section'>为什么推荐</div>${cur.reason.map((r,i)=>`<div class='why'><span class='dot'>${i+1}</span><span>${r}</span></div>`).join('')}<div class='section'>建议怎么说</div><div class='talk'>${cur.talk}</div><div style='display:flex;gap:8px;flex-wrap:wrap;margin-top:14px'><button class='btn primary' onclick='toast("话术已复制")'>复制话术</button><button class='btn green' onclick='toast("已加入我的今日跟进")'>加入跟进</button><button class='btn secondary' onclick='toast("已标记：先不跟")'>先不跟</button></div>`}function changeRule(){rule=document.getElementById('rule').value;document.getElementById('ruleNameText').textContent=rule;cur=datasets[rule][0];selected.clear();render();toast('已切换规则')}function toggle(n){selected.has(n)?selected.delete(n):selected.add(n);render()}function selectHigh(){datasets[rule].filter(x=>x.level==='高').forEach(x=>selected.add(x.name));render();toast('已选中高推荐客户')}function addSelected(){toast(selected.size?`已加入 ${selected.size} 家到今日跟进`:'请先选择客户')}function toast(t){const el=document.getElementById('toast');el.textContent=t;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),1800)}render();
</script>
</body>
</html>
